<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUTIX - Torre de Control Logística BI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#F8FAFC}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 10px 15px -5px rgba(0,0,0,.02)}
.nav-active{background:#FEF3C7!important;color:#C2410C!important;font-weight:600}
.g2,.g3,.g4{display:grid;gap:1rem}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.sp2{grid-column:span 2}
@media(max-width:1023px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.sp2{grid-column:auto}#sidebar{display:none}#dd,#hl{display:block}#sr{display:none}}
@media(max-width:639px){.g4{grid-template-columns:1fr}}
#dd,#hl{display:none}
#app.m{max-width:412px;margin:2vh auto;height:94vh;width:100%;border:10px solid #334155;border-radius:40px;overflow:hidden}
#app.m #sidebar,#app.m #sr,#app.m #bc{display:none}#app.m #dd,#app.m #hl{display:block}
#app.m .g4,#app.m .g3,#app.m .g2{grid-template-columns:1fr}#app.m .sp2{grid-column:auto}
body:has(#app.m){background:#0F172A}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
</style></head>
<body class="text-slate-800 antialiased overflow-hidden">
<div id="app" class="flex h-screen w-screen bg-[#F8FAFC]">
<aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0">
 <div>
  <div class="h-16 flex items-center px-6 border-b border-slate-100"><span class="select-none cursor-pointer inline-flex items-center pr-2" onclick="go(ROLES[role].h)"><span class="text-2xl font-extrabold tracking-tight text-[#1C2D4A]">RUTI</span><span class="text-2xl font-black text-[#0284C7] relative inline-block">X<span class="absolute -top-0.5 -right-2 text-[#06B6D4] text-[9px] font-black">▲</span></span></span></div>
  <div class="px-3 py-4"><nav id="nav"></nav></div>
  <div class="px-3 py-2"><p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">Configuración</p>
   <button onclick="toast('Ayuda y soporte: soporte@rutix.co')" class="w-full text-left px-3 py-2 text-xs text-slate-600 rounded-lg hover:bg-slate-50">ⓘ&nbsp; Ayuda y soporte</button>
   <button onclick="toast('Configuración: opciones del tablero')" class="w-full text-left px-3 py-2 text-xs text-slate-600 rounded-lg hover:bg-slate-50">⚙&nbsp; Configuración</button></div>
 </div>
 <div class="p-4 border-t border-slate-100 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-xs">RL</div><div><p class="text-xs font-semibold">Sede Colombia</p><p class="text-[10px] text-slate-400">Torre Multipaís v2.4</p></div></div>
</aside>
<main class="flex-1 flex flex-col overflow-hidden min-w-0">
 <header class="h-16 bg-white border-b border-slate-200 px-4 flex items-center justify-between gap-2 shrink-0">
  <div class="flex items-center gap-2 min-w-0">
   <span id="hl"><span class="select-none cursor-pointer inline-flex items-center pr-2" onclick="go(ROLES[role].h)"><span class="text-lg font-extrabold tracking-tight text-[#1C2D4A]">RUTI</span><span class="text-lg font-black text-[#0284C7] relative inline-block">X<span class="absolute -top-0.5 -right-2 text-[#06B6D4] text-[9px] font-black">▲</span></span></span></span>
   <select id="dd" onchange="go(this.value)" class="text-xs font-bold bg-slate-100 border border-slate-200 rounded-xl px-2 py-1.5 max-w-[150px]"></select>
   <div id="bc" class="flex items-center text-xs font-medium text-slate-500 gap-1.5 whitespace-nowrap"><span>RUTIX</span><span>/</span><span>Torre de Control Logística</span><span>/</span><span id="bcv" class="text-slate-900 font-semibold"></span></div>
  </div>
  <div id="sr" class="hidden md:flex items-center relative w-72"><span class="absolute left-3 text-slate-400 text-xs">⌕</span><input id="q" oninput="search(this.value)" placeholder="Buscar guía, transportista o ruta..." class="w-full text-xs pl-8 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-full focus:outline-none focus:ring-1 focus:ring-blue-500"></div>
  <div class="flex items-center gap-2">
   <button onclick="toggleMobile()" title="Modo táctil / móvil" class="p-2 text-xs text-slate-500 hover:bg-slate-50 rounded-lg border border-slate-200">📱</button>
   <button onclick="alerts()" class="p-2 text-xs text-slate-500 hover:bg-slate-50 rounded-lg border border-slate-200 relative">🔔<span class="w-2 h-2 bg-red-500 rounded-full absolute top-1 right-1"></span></button>
   <select onchange="month(this)" class="text-xs font-semibold bg-white border border-slate-200 rounded-full px-2 py-1.5"><option>Oct 2026</option><option>Sep 2026</option><option>Ago 2026</option></select>
   <select id="rls" onchange="setRole(this.value)" class="text-xs font-semibold bg-slate-900 text-white rounded-full px-3 py-1.5 max-w-[120px]"><option value="CEO">Dirección General</option><option value="GERENCIA">Gerencia de País</option><option value="OPERACIONES">Jefe de Operaciones</option></select>
  </div>
 </header>
 <div id="view" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-5"></div>
</main></div>
<div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs z-50 transition-all duration-300 opacity-0 translate-y-24 pointer-events-none"></div>

<script>
/* ===== DATASET SINTÉTICO REPRODUCIBLE (1.240 envíos, 37 incidentes, OTD global 94,7%) ===== */
let _s=7;const R=()=>(_s=(_s*16807)%2147483647)/2147483647;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=w=>{let r=R(),i=0;while(i<w.length-1&&r>w[i]){r-=w[i];i++}return i};
const CITIES=['Bogotá','Medellín','Cali','Barranquilla','Cartagena','Bucaramanga','Pereira','Santa Marta','Cúcuta','Manizales','Villavicencio','Ibagué'];
const VOL=[1200,720,560,430,400,300,240,220,200,190,170,170],CR=[.061,.047,.068,.049,.041,.058,.05,.045,.075,.052,.055,.05];
const RG=['Andina','Andina','Pacífica','Caribe','Caribe','Andina','Eje Cafetero','Caribe','Oriente','Eje Cafetero','Oriente','Andina'],REGS=['Andina','Caribe','Pacífica','Eje Cafetero','Oriente'];
const CARR=['TransLogix','Servirápido','CargaExpress','EnvíosCo','Flota Local','TransCaribe','Rápido Andino','LogiNorte','Vía Express'];
const AR=[.038,.055,.08,.102,.12,.06,.07,.045,.09],AW=[.16,.14,.12,.09,.07,.12,.1,.12,.08];
const FLEET=['Tractomula','Camión C3','Camión C2','Turbo / Van'],FR=[4800,3600,2900,2100];
const NDAY=25,DAYS=[...Array(NDAY)].map((_,i)=>(1+i)+' Oct'),ST=['Entregado','En tránsito','Pendiente','Cancelado'];
const SH=[];CITIES.forEach((c,ci)=>{for(let i=0;i<VOL[ci];i++){const a=pick(AW),f=pick([.15,.3,.3,.25]),km=25+R()*130;
 SH.push({c,ci,rg:RG[ci],a:CARR[a],d:Math.floor(R()*NDAY),f:FLEET[f],km,cost:km*FR[f]*(.85+R()*.3),kg:R()*29.6,val:90000+R()*720000,st:ST[pick([.72,.14,.09,.05])],sc:Math.log(R())/(CR[ci]*AR[a]),late:0})}});
[...SH].sort((x,y)=>y.sc-x.sc).slice(0,254).forEach(s=>s.late=1);
const TY=['Retraso en ruta','Doc. incompleta','Ausencia cliente','Falla mecánica','Daño empaque'];
const tys=shuf([].concat(...[69,40,19,12,3].map((n,i)=>Array(n).fill(i)))),sevs=shuf([].concat(...[30,60,53].map((n,i)=>Array(n).fill(['ALTA','MEDIA','BAJA'][i]))));
/* ★ 5 registros reales del documento maestro + 143 simulados = 148 incidentes */
const REAL=[['GD-20418','TransCaribe','Cartagena','Cartagena – Bogotá','ALTA','Retraso en ruta','Retraso > 48 h'],['GD-20431','Rápido Andino','Bogotá','Bogotá – Medellín','MEDIA','Daño empaque','Daño parcial'],['GD-20447','LogiNorte','Barranquilla','Barranquilla – Cartagena','BAJA','Ausencia cliente','Cambio de ventana'],['GD-20452','Vía Express','Cali','Cali – Bogotá','ALTA','Retraso en ruta','Carga no entregada'],['GD-20466','TransCaribe','Cartagena','Cartagena – Medellín','MEDIA','Retraso en ruta','Retraso 12–24 h']].map(x=>({g:x[0],a:x[1],c:x[2],rg:RG[CITIES.indexOf(x[2])],r:x[3],v:x[4],t:x[5],x:x[6],d:NDAY-1,h:2+R()*4,real:1}));
const INC=REAL.concat(shuf(SH.filter(s=>s.late)).slice(0,143).map((s,i)=>({g:'GD-'+(20470+i*6),c:s.c,rg:s.rg,a:s.a,d:s.d,r:s.c+' – '+CITIES[(s.ci+1+Math.floor(R()*11))%12],t:TY[tys[i]],v:sevs[i],h:1.5+R()*5.4}))).sort((a,b)=>b.d-a.d);
/* Modelo financiero: libro ROI_RUTIX_3anios v5 (Excel) */
const ROI={cost:[38747805,6431586,6431586,6431586],ben:[0,19714800,28164000,28164000],cum:[-38747805,-25464591,-3732177,18000237]};

/* ===== ESTADO Y FILTROS ===== */
const F={city:null,carr:null,sev:null,reg:null,q:''};let LIM=40;let cur='resumen',role='CEO',charts={};
const $=id=>document.getElementById(id),fm=n=>Math.round(n).toLocaleString('es-CO'),pc=n=>n.toFixed(1).replace('.',',')+'%',sum=(a,k)=>a.reduce((t,x)=>t+x[k],0);
const T={resumen:'Resumen ejecutivo',direccion:'Dirección General',gerencia:'Gerencia de País',operaciones:'Operaciones logísticas',kpi1:'Seguimiento de envíos',kpi2:'Cumplimiento OTD',kpi3:'Costos logísticos & ROI',kpi4:'Gestión de incidencias'};
const IC={resumen:'▦',direccion:'▥',gerencia:'⌖',operaciones:'⇄',kpi1:'⛟',kpi2:'✓',kpi3:'$',kpi4:'⚠'};
const ROLES={CEO:{v:Object.keys(T),h:'resumen'},GERENCIA:{v:['resumen','gerencia','operaciones','kpi1','kpi2','kpi4'],h:'gerencia'},OPERACIONES:{v:['operaciones','kpi1','kpi2','kpi4'],h:'operaciones'}};
const S_=(sc,sa,sr)=>SH.filter(s=>(sc||!F.city||s.c==F.city)&&(sa||!F.carr||s.a==F.carr)&&(sr||!F.reg||s.rg==F.reg));
const I_=(ss)=>INC.filter(i=>(!F.city||i.c==F.city)&&(!F.carr||i.a==F.carr)&&(!F.reg||i.rg==F.reg)&&(ss||!F.sev||i.v==F.sev));
function M(){const S=S_(),n=S.length,ok=S.filter(s=>!s.late).length,I=I_();return{S,n,ok,I,otd:n?100*ok/n:0,kg:sum(S,'kg'),val:sum(S,'val'),cost:sum(S,'cost'),f:n/1240}}
const otdBy=(S,k,L)=>L.map(v=>{const x=S.filter(s=>s[k]==v);return x.length?100*x.filter(s=>!s.late).length/x.length:0});
const cntBy=(S,k,L)=>L.map(v=>S.filter(s=>s[k]==v).length);
const dOTD=S=>DAYS.map((_,d)=>{const x=S.filter(s=>s.d==d);return x.length?100*x.filter(s=>!s.late).length/x.length:null});
const dCnt=S=>DAYS.map((_,d)=>S.filter(s=>s.d==d).length);
const oc=v=>v>=95?'#16A34A':v>=90?'#F59E0B':'#DC2626',hl=(L,sel,fn)=>L.map((l,i)=>sel&&l!=sel?'#CBD5E1':fn(l,i));
function setF(k,v){F[k]=F[k]==v?null:v;render();toast(F[k]?'Cross-filter activado: '+v+'. Métricas recalculadas.':'Filtro removido.')}
function sv(v){F.sev=v;render()}
function clearF(){F.city=F.carr=F.sev=F.reg=null;LIM=40;F.q='';$('q').value='';render()}
function search(v){F.q=v.toLowerCase();if(cur!='operaciones'&&ROLES[role].v.includes('operaciones'))go('operaciones');else render()}
function month(el){if(el.selectedIndex){toast('Este dataset solo contiene datos de Oct 2026.');el.selectedIndex=0}}
function alerts(){const a=INC.filter(i=>i.v=='ALTA').length;toast('🔔 '+a+' incidentes de severidad alta requieren acción inmediata.')}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.className=e.className.replace('opacity-0 translate-y-24','opacity-100 translate-y-0');clearTimeout(tt);tt=setTimeout(()=>e.className=e.className.replace('opacity-100 translate-y-0','opacity-0 translate-y-24'),3200)}
function toggleMobile(){$('app').classList.toggle('m');render()}
function setRole(r){role=r;buildNav();go(ROLES[r].h);toast('RLS aplicado: '+$('rls').selectedOptions[0].text)}
function go(v){if(!ROLES[role].v.includes(v))return;cur=v;render()}
const MAIN=['resumen','direccion','gerencia','operaciones'],KPIS=['kpi1','kpi2','kpi3','kpi4'];
function buildNav(){const v=ROLES[role].v,b=k=>`<button data-v="${k}" onclick="go('${k}')" class="nb w-full flex items-center gap-3 px-3 py-2 text-xs text-slate-600 rounded-lg hover:bg-slate-50 transition"><span class="w-4 text-center">${IC[k]}</span><span>${T[k]}</span></button>`;
 const grp=(t,a,first)=>{const x=a.filter(k=>v.includes(k));return x.length?`<p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2 ${first?'':'mt-5 pt-4 border-t border-slate-100'}">${t}</p><div class="space-y-1">${x.map(b).join('')}</div>`:''};
 $('nav').innerHTML=grp('Main Menu',MAIN,1)+grp('Indicadores Clave (KPI)',KPIS,0);
 $('dd').innerHTML=[['Menú Principal',MAIN],['Indicadores Clave (KPI)',KPIS]].map(g=>{const x=g[1].filter(k=>v.includes(k));return x.length?`<optgroup label="${g[0]}">${x.map(k=>`<option value="${k}">${T[k]}</option>`).join('')}</optgroup>`:''}).join('')}

/* ===== COMPONENTES ===== */
const OKc='bg-emerald-100 text-emerald-700',WRc='bg-amber-100 text-amber-800',ERc='bg-red-100 text-red-700';
const K=(l,v,s,t,tc,dk)=>`<div class="${dk?'bg-slate-900 text-white rounded-[14px] shadow':'card'} p-5"><div class="text-xs font-medium ${dk?'text-slate-300':'text-slate-500'}">${l}</div><div class="text-3xl font-bold mt-3">${v}</div><div class="mt-2 flex items-center justify-between gap-2 text-[11px] text-slate-400"><span>${s}</span>${t?`<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${tc}">${t}</span>`:''}</div></div>`;
const P=(t,s,id,sp='',h='h-60',x='')=>`<div class="card p-5 ${sp}"><div class="flex justify-between items-start mb-3 gap-2"><div><h3 class="text-xs font-bold uppercase tracking-wider text-slate-700">${t}</h3><p class="text-xs text-slate-400">${s}</p></div>${x}</div><div class="${h} relative"><canvas id="${id}"></canvas></div></div>`;
const SC=(o={})=>({y:Object.assign({grid:{color:'#F1F5F9'}},o.y||{}),x:Object.assign({grid:{display:false}},o.x||{})});
function C(id,type,L,D,o={}){const el=$(id);if(!el)return;charts[id]=new Chart(el,{type,data:{labels:L,datasets:D},options:Object.assign({responsive:true,maintainAspectRatio:false,indexAxis:o.ax,spanGaps:true,plugins:{legend:{display:!!o.leg,position:'bottom',labels:{boxWidth:10,font:{size:11}}}},scales:o.sc||SC(),cutout:o.cut,
 onClick:o.click?(e,el)=>{if(el.length)o.click(el[0].index)}:undefined,onHover:o.click?(e,el)=>{e.native.target.style.cursor=el.length?'pointer':'default'}:undefined},o.x||{})})}
const line=(l,d,c,x={})=>Object.assign({label:l,data:d,borderColor:c,borderWidth:2.5,tension:.35,pointRadius:3},x),meta=(n,v)=>line('Meta',Array(n).fill(v),'#16A34A',{borderDash:[5,5],pointRadius:0,borderWidth:1.5});
const sevTag=v=>`<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${v=='ALTA'?ERc:v=='MEDIA'?WRc:OKc}">${v}</span>`;
const rowsOps=(I,full)=>I.map(i=>`<tr class="hover:bg-slate-50"><td class="py-2.5 font-semibold text-slate-800">${i.real?'<span class="text-amber-500" title="Registro del documento maestro">★</span> ':''}${i.g}</td><td class="py-2.5">${i.a}</td><td class="py-2.5">${i.r}</td><td class="py-2.5">${sevTag(i.v)}</td><td class="py-2.5 text-slate-600">${i.t}${i.x?` <span class="text-slate-400">· ${i.x}</span>`:''}</td>${full?`<td class="py-2.5 text-right"><button onclick="toast('${i.g}: ${i.t} · resolución est. ${i.h.toFixed(1)} h')" class="text-blue-600 font-semibold text-[11px]">Detalles</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="py-6 text-center text-slate-400">Sin registros para los filtros activos</td></tr>';
const regClick=i=>setF('reg',REGS[i]),cityClick=i=>setF('city',CITIES[i]),carrClick=i=>setF('carr',CARR[i]);
function bar(){const c=[['city',F.city],['reg',F.reg],['carr',F.carr],['sev',F.sev]].filter(x=>x[1]);return c.length?`<div class="flex flex-wrap items-center gap-2 text-xs"><span class="text-slate-400 font-semibold">Filtros activos:</span>${c.map(x=>`<button onclick="setF('${x[0]}','${x[1]}')" class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-semibold">${x[1]} ✕</button>`).join('')}<button onclick="clearF()" class="text-blue-600 font-semibold">Limpiar todo</button></div>`:''}

/* ===== VISTAS (se recalculan con cada filtro) ===== */
const V={};
V.resumen=m=>{const al=m.I.filter(i=>i.v=='ALTA').length,ot=m.otd>=95,bud=380*m.f,cm=m.cost/1e6,sc=cntBy(m.S,'st',ST);
 return[`<div class="g4">${K('Entregas a tiempo',pc(m.otd),'Meta: 95,0%',ot?'Meta cumplida':'En alerta',ot?OKc:WRc,1)}${K('Costos logísticos','$'+fm(cm)+' M','Presupuesto: $'+fm(bud)+' M',cm<=bud?'Meta cumplida':'Sobre presupuesto',cm<=bud?OKc:ERc)}${K('Incidentes logísticos',m.I.length,al+' de severidad alta',al?'Atención':'Sin críticos',al?ERc:OKc)}${K('Satisfacción cliente','4,5 <span class="text-sm font-normal text-slate-400">/ 5</span>','Encuestas: '+fm(420*m.f),'Meta cumplida',OKc)}</div>
 <div class="g3">${P('Evolución del cumplimiento de entregas','Meta estipulada en SLA: 95,0%','c1','sp2')}${P('Estado de los envíos','Total: '+fm(m.n)+' envíos','c2')}</div>
 <div class="g3"><div class="space-y-3">${[['kpi2','Cumplimiento de entregas (OTD)','Control granular de SLAs'],['kpi3','Control de costos logísticos','Ejecución vs presupuesto y ROI'],['kpi4','Gestión de incidencias','Severidad de anomalías']].filter(x=>ROLES[role].v.includes(x[0])).map(x=>`<div onclick="go('${x[0]}')" class="card p-4 flex justify-between items-center cursor-pointer hover:shadow-md"><div><h4 class="text-xs font-semibold">${x[1]}</h4><p class="text-[11px] text-slate-400">${x[2]}</p></div><span class="text-slate-400 font-bold">›</span></div>`).join('')}</div>
 <div class="card p-5 sp2 overflow-x-auto"><div class="flex justify-between mb-3"><h3 class="text-sm font-bold">Envíos e incidencias recientes</h3><button onclick="go('operaciones')" class="text-xs font-semibold text-blue-600">Ver todos ↗</button></div><table class="w-full text-left text-xs"><thead><tr class="text-slate-400 border-b"><th class="pb-2">Guía</th><th>Transportista</th><th>Ruta</th><th>Severidad</th><th>Incidente</th></tr></thead><tbody class="divide-y divide-slate-100">${rowsOps(m.I.slice(0,4))}</tbody></table></div></div>`,
 m=>{const o=dOTD(m.S);C('c1','line',DAYS,[line('OTD',o,'#0F172A',{fill:true,backgroundColor:'rgba(15,23,42,.05)'}),meta(DAYS.length,95)],{sc:SC({y:{min:80,max:100,ticks:{callback:v=>v+'%'}}})});
  C('c2','doughnut',ST,[{data:sc,backgroundColor:['#0F172A','#F59E0B','#10B981','#38BDF8'],borderWidth:0}],{leg:1,cut:'72%',sc:{}})}]};
V.direccion=m=>{const f=m.f,H=[422,410,395,388,379,372],inc=[58,52,49,45,41].map(v=>Math.round(v*f)).concat(m.I.length),r=ROI;
 return[`<div class="g2">${P('Costos logísticos (M COP)','Real vs presupuesto $'+fm(380*f)+'M (según filtros)','c1','','h-60','<span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded h-fit">Meta '+fm(380*f)+'M</span>')}${P('Satisfacción del cliente (CSAT)','Meta 4,5 / 5,0','c2')}${P('Incidentes por mes','Mayo – Octubre (Oct = filtro actual)','c3')}
